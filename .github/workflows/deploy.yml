name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: app/package-lock.json
        
    - name: Install dependencies
      working-directory: app
      run: npm ci

    - name: Create production environment file
      working-directory: app
      run: |
        cat > .env.production << EOF
        VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
        VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
        VITE_JESS_USERNAME=${{ secrets.JESS_USERNAME }}
        VITE_JESS_PASSWORD=${{ secrets.JESS_PASSWORD }}
        VITE_GBTECH_USERNAME=${{ secrets.GBTECH_USERNAME }}
        VITE_GBTECH_PASSWORD=${{ secrets.GBTECH_PASSWORD }}
        VITE_LARS_USERNAME=${{ secrets.LARS_USERNAME }}
        VITE_LARS_PASSWORD=${{ secrets.LARS_PASSWORD }}
        VITE_DEFAULT_TENANT_ID=${{ secrets.DEFAULT_TENANT_ID }}
        VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
        VITE_OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
        EOF

    - name: Build React app
      working-directory: app
      run: npm run build
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: github.ref == 'refs/heads/main'
      
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: ./docs
        
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/main'
